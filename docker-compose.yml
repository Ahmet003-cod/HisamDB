services:
  hisamdb:
    build:
      context: .
      dockerfile: Dockerfile
    image: hisamdb:1.1.0
    container_name: hisamdb-server
    ports:
      - "8000:8000"
    environment:
      HISAM_HOST: "0.0.0.0"
      HISAM_PORT: "8000"
      HISAM_DATA_DIR: "/data"
      HISAM_SNAPSHOT_DIR: "/data/_snapshots"
      HISAM_USE_MMAP: "false"
      HISAM_MAX_WORKERS: "4"
      # Üretim için mutlaka güçlü anahtar tanımlayın:
      # Biçim: <raw_veya_sha256_key>:<key_id>:<scopes>[:<tenant_id>] (';' ile ayrılmış)
      HISAM_REQUIRE_AUTH: "false"
      # HISAM_API_KEYS: "hisam_admin_change_me:admin:read,write,admin;hisam_acme_key:acme:read,write:acme_corp"
      HISAM_RATE_LIMIT_RPS: "200"
      HISAM_RATE_LIMIT_BURST: "400"
      HISAM_MAX_BATCH_SIZE: "10000"
    volumes:
      - hisamdb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hisamdb_data:
