[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microvectordb"
version = "0.2.0"
description = "A lightweight, fast, and persistent vector database with ChromaDB/FAISS-like API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Huneyn Kaya" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0"
]

[project.optional-dependencies]
hnsw = ["hnswlib>=0.7.0"]
dev = [
    "pytest>=7.0.0"
]
