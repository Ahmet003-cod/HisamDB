[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisamdb"
version = "1.1.0"
description = "HisamDB — Cutting-edge, ultra-low-memory, hybrid-search & RAG vector database for Python (NumPy-only core + LangChain & LlamaIndex)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ahmet GÜN" }
]
maintainers = [
    { name = "Ahmet GÜN" }
]
requires-python = ">=3.8"
keywords = [
    "hisamdb",
    "vector-database",
    "vectordb",
    "rag",
    "semantic-search",
    "hybrid-search",
    "bm25",
    "hnsw",
    "ivf",
    "quantization",
    "embeddings",
    "numpy",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.20.0"
]

[project.urls]
Homepage = "https://github.com/Ahmet003-cod/HisamDB"
Repository = "https://github.com/Ahmet003-cod/HisamDB"
Documentation = "https://github.com/Ahmet003-cod/HisamDB#readme"
Changelog = "https://github.com/Ahmet003-cod/HisamDB/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ahmet003-cod/HisamDB/issues"

[project.scripts]
hisamdb-server = "hisamdb.api.server:main"

[project.optional-dependencies]
hnsw = ["hnswlib>=0.7.0"]
fast = ["orjson>=3.9.0"]
server = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "pydantic>=2.0.0"]
langchain = ["langchain-core>=0.2.0"]
llamaindex = ["llama-index-core>=0.10.0"]
all = ["hnswlib>=0.7.0", "orjson>=3.9.0", "fastapi>=0.110.0", "uvicorn>=0.27.0", "pydantic>=2.0.0"]
bench = ["psutil>=5.9.0", "faiss-cpu>=1.7.4"]
dev = [
    "pytest>=7.0.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
include = ["hisamdb*"]
exclude = ["tests*", "benchmarks*", "docs*", "examples*", "kernels_experimental*"]
